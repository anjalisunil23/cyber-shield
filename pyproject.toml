[tool.pyrefly]
search-path = [
    "backend/.venv/Lib/site-packages",
    "tests/selenium"
]
site-package-path = [
    "backend/.venv/Lib/site-packages"
]

[tool.pytest.ini_options]
pythonpath = [
    "backend",
    "."
]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning"
]
